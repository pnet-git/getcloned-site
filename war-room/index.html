function today(){return new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function daysSince(d){if(!d)return 0;return Math.floor((new Date()-new Date(d))/(1000*60*60*24))}

function setSyncStatus(s){
  const dot=document.getElementById('sync-dot');
  const txt=document.getElementById('sync-status');
  if(s==='ok'){dot.className='sync-dot';txt.textContent='Synced'}
  else if(s==='syncing'){dot.className='sync-dot syncing';txt.textContent='Saving...'}
  else{dot.className='sync-dot error';txt.textContent='Sync error'}
}

async function sbFetch(path,opts={}){
  const res=await fetch(SB_URL+path,{
    ...opts,
    headers:{
      'apikey':SB_KEY,
      'Authorization':'Bearer '+SB_KEY,
      'Content-Type':'application/json',
      'Prefer':'return=representation',
      ...(opts.headers||{})
    }
  });
  if(!res.ok)throw new Error(await res.text());
  const txt=await res.text();
  return txt?JSON.parse(txt):[];
}

async function loadFromDB(){
  try{
    const rows=await sbFetch('/rest/v1/warroom_state?select=*');

    setSyncStatus('ok');
    synced=true;
  }catch(e){
    console.error('Load error',e);
    setSyncStatus('error');
  }
}

async function saveTask(id){
  setSyncStatus('syncing');
  try{
    const s=state[id];
    await sbFetch('/rest/v1/warroom_state',{
      method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=representation'},
      body:JSON.stringify({id,status:s.status,logs:s.logs,updated_at:new Date().toISOString()})
    });
    setSyncStatus('ok');
    document.getElementById('last-updated').textContent='Updated: '+today();
  }catch(e){
    console.error('Save error',e);
    setSyncStatus('error');
  }
}

function ensureTask(id){if(!state[id])state[id]={status:'todo',logs:[]}}

        <div class="task-sub">${t.sub}</div>

      <div class="log-form-btns">
        <button class="save" data-saveid="${t.id}">Save</button>
        <button data-cancelid="${t.id}">Cancel</button>
      </div>
    </div>`;
  return div;
}

  board.innerHTML='';
  Object.entries(SECTIONS).forEach(([key,sec])=>{
    const tasks=TASKS.filter(t=>t.sec===key);
    const done=tasks.filter(t=>(state[t.id]?.status||'todo')==='done').length;
    const section=document.createElement('div');
    section.className='section';
    const header=document.createElement('div');
    header.className='sec-header '+sec.cls;
    header.innerHTML=`<span class="sec-title">${sec.label}</span><span class="sec-count" id="sc-${key}">${done}/${tasks.length} done</span>`;
    section.appendChild(header);
    tasks.forEach(t=>section.appendChild(renderTask(t)));
    board.appendChild(section);
  });

  board.addEventListener('click',async function(e){
    const sb=e.target.closest('[data-id]');
    if(sb){
      const id=sb.dataset.id;
      const cur=state[id]?.status||'todo';
      const next=STATUS_CYCLE[(STATUS_CYCLE.indexOf(cur)+1)%3];
      state[id].status=next;
      if(next==='done'){state[id].logs=state[id].logs||[];if(!state[id].logs.find(l=>l.startsWith('✓')))state[id].logs.push('✓ Done: '+today());}
      refreshTask(id);updateStats();updateSectionCounts();
      await saveTask(id);
      return;
    }
    const lb=e.target.closest('[data-logid]');
    if(lb){document.getElementById('lf-'+lb.dataset.logid).classList.toggle('open');return;}
    const sv=e.target.closest('[data-saveid]');
    if(sv){
      const id=sv.dataset.saveid;
      const val=document.getElementById('li-'+id).value.trim();
      if(val){state[id].logs=state[id].logs||[];state[id].logs.push(today()+': '+val);refreshTask(id);await saveTask(id);}
      document.getElementById('lf-'+id).classList.remove('open');return;
    }
    const cl=e.target.closest('[data-cancelid]');
    if(cl)document.getElementById('lf-'+cl.dataset.cancelid).classList.remove('open');
  });
}

function refreshTask(id){
  const t=TASKS.find(x=>x.id===id);
  if(!t)return;
  const old=document.getElementById('task-'+id);
  if(old)old.replaceWith(renderTask(t));
}

function updateSectionCounts(){
  Object.keys(SECTIONS).forEach(key=>{
    const tasks=TASKS.filter(t=>t.sec===key);
    const done=tasks.filter(t=>(state[t.id]?.status||'todo')==='done').length;
    const el=document.getElementById('sc-'+key);
    if(el)el.textContent=done+'/'+tasks.length+' done';
  });
}

function renderClients(){
  const grid=document.getElementById('client-grid');
  grid.innerHTML='';
  CLIENTS.forEach(c=>{
    const days=c.stuckSince?daysSince(c.stuckSince):0;
    const badgeClass=c.status==='loop'?'badge-loop':'badge-active';
    const badgeLabel=c.status==='loop'?'LIVE — LOOPING':'ACTIVE';
    const waitingClass=c.waitingOn==='client'?'waiting-client':c.waitingOn==='you'?'waiting-you':'waiting-live';
    const waitingLabel=c.waitingOn==='client'?'⚠ WAITING ON CLIENT':c.waitingOn==='you'?'◎ WAITING ON YOU':'✓ LIVE';
    const daysHtml=days>0?`<span class="days-stuck">${days}d overdue</span>`:`<span class="days-live">On track</span>`;
    const stagesHtml=STAGES.map(s=>{
      const isDone=s.id<c.currentStage;
      const isActive=s.id===c.currentStage;
      const cls=isDone?'stage-done':isActive?'stage-active':'stage-todo';
      const numCls=isDone?'stage-num-done':isActive?'stage-num-active':'stage-num-todo';
      const labelCls=isDone?'stage-label-done':isActive?'stage-label-active':'stage-label-todo';
      const loopTag=s.loop&&isActive?`<span class="stage-loop">↺ LOOPS TO 3</span>`:'';
      return `<div class="stage-item ${cls}"><span class="stage-num ${numCls}">${isDone?'✓':s.id}</span><span class="stage-label ${labelCls}">${s.label}</span>${loopTag}</div>`;
    }).join('');
    const card=document.createElement('div');
    card.className='client-card';
    card.innerHTML=`
      <div class="client-card-header"><span class="client-name">${c.name}</span><span class="client-badge ${badgeClass}">${badgeLabel}</span></div>
      <div class="client-meta"><span class="waiting-tag ${waitingClass}">${waitingLabel}</span>${daysHtml}</div>
      <div class="roadmap"><div class="roadmap-title">Build Journey</div><div class="stage-list">${stagesHtml}</div><div style="font-size:10px;color:var(--text3);margin-top:10px;line-height:1.5">${c.note}</div></div>`;
    grid.appendChild(card);
  });
}

async function init(){
  setSyncStatus('syncing');
  await loadFromDB();
  TASKS.forEach(t=>ensureTask(t.id));
  renderBoard();
  updateStats();
  renderClients();
  document.getElementById('last-updated').textContent='Updated: '+today();
}
</script>
</body>
</html>
